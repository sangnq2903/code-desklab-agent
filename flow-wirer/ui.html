<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { font: 12px Inter, system-ui, sans-serif; margin: 0; padding: 12px; display: flex; flex-direction: column; gap: 8px; height: 100vh; box-sizing: border-box; }
  textarea { flex: 1; font: 11px ui-monospace, Menlo, monospace; resize: none; padding: 6px; }
  select, button { font: inherit; padding: 6px 8px; }
  button { background: #0d99ff; color: #fff; border: 0; border-radius: 6px; cursor: pointer; }
  #log { height: 140px; overflow: auto; background: #f5f5f5; border-radius: 6px; padding: 6px; font: 11px ui-monospace, Menlo, monospace; white-space: pre-wrap; }
  .ok { color: #1a7f37; } .fail { color: #cf222e; }
  label { display: flex; align-items: center; gap: 6px; }
</style></head>
<body>
  <textarea id="json" placeholder='{ "start": "Home", "links": { "Home/btn-login": "Login", "Login/btn-back": "BACK" } }'></textarea>
  <label>Transition
    <select id="transition">
      <option value="SMART_ANIMATE">SMART_ANIMATE</option>
      <option value="DISSOLVE">DISSOLVE</option>
      <option value="NONE">NONE</option>
    </select>
  </label>
  <button id="run">Nối flow</button>
  <div id="log"></div>
<script>
  var logEl = document.getElementById("log");
  function add(cls, text) {
    var d = document.createElement("div");
    d.className = cls; d.textContent = (cls === "ok" ? "✓ " : cls === "fail" ? "✗ " : "") + text;
    logEl.appendChild(d); logEl.scrollTop = logEl.scrollHeight;
  }
  document.getElementById("run").onclick = function () {
    logEl.innerHTML = "";
    parent.postMessage({ pluginMessage: {
      type: "wire",
      json: document.getElementById("json").value,
      transition: document.getElementById("transition").value
    } }, "*");
  };
  onmessage = function (e) {
    var m = e.data.pluginMessage; if (!m) return;
    if (m.type === "log") add(m.ok ? "ok" : "fail", m.text);
    if (m.type === "done") add("", "Xong: " + m.ok + " OK, " + m.fail + " lỗi");
  };
</script></body></html>
